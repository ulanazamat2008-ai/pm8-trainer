<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Тренажёр ПМ 8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered working column — toolbar, question map, then the active card (quiz or cheat sheet). */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --sunk:#e9eef2; --ink:#13202a; --muted:#5a6a76; --line:#d6dee4;
  --accent:#2c5bd0; --accent-soft:#e3eafb; --on-accent:#ffffff;
  --pass:#17803a; --pass-soft:#e2f3e7; --fail:#c2342c; --fail-soft:#fbe5e3;
  --code-bg:#0f1a23; --code-ink:#d8e4ec;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#161f26; --sunk:#1c2730; --ink:#e3eaef; --muted:#93a3ae; --line:#27343e;
  --accent:#7ea3ff; --accent-soft:#1d2a47; --on-accent:#0e1418;
  --pass:#46c06a; --pass-soft:#16301f; --fail:#f2695f; --fail-soft:#3a1b19;
  --code-bg:#0a1015; --code-ink:#d8e4ec; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#161f26; --sunk:#1c2730; --ink:#e3eaef; --muted:#93a3ae; --line:#27343e;
  --accent:#7ea3ff; --accent-soft:#1d2a47; --on-accent:#0e1418;
  --pass:#46c06a; --pass-soft:#16301f; --fail:#f2695f; --fail-soft:#3a1b19;
  --code-bg:#0a1015; --code-ink:#d8e4ec; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.sub b{color:var(--ink);font-weight:600}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{color:var(--fail)}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}

.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.map summary{cursor:pointer;font-weight:700;font-size:14px;list-style-position:inside}
.map summary span{font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:12.5px;margin-left:6px}
.map:not([open]){padding-block:12px}
@media (max-width:600px){
  body{padding-block:16px 40px}
  .wrap{gap:14px}
  .bar{gap:8px}
  .chk{font-size:13px}
  .cells{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
  .cell{padding:8px 0}
  .opt{padding:12px}
  .hint{display:none}
  .nav .btn{flex:1;padding:11px 12px}
}
.map-head{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}
.map-head strong{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.dot.ok{background:var(--pass);border-color:var(--pass)} .dot.no{background:var(--fail);border-color:var(--fail)}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.cell{border:1px solid var(--line);background:var(--sunk);border-radius:6px;font-family:var(--f-mono);font-size:11.5px;padding:5px 0;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.ok{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.cell.no{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .tally b{color:var(--pass)} .meta .tally i{font-style:normal;color:var(--fail)}
.prog{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.qtext{font-size:clamp(17px,2.4vw,19px);font-weight:650;line-height:1.45;margin:0;text-wrap:pretty}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:13.5px;line-height:1.6;padding:14px 16px;border-radius:10px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:26px;height:26px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.opt .t{min-width:0;padding-top:2px;overflow-wrap:anywhere}
.opt.good{border-color:var(--pass);background:var(--pass-soft)} .opt.good .l{background:var(--pass);color:var(--surface)}
.opt.bad{border-color:var(--fail);background:var(--fail-soft)} .opt.bad .l{background:var(--fail);color:var(--surface)}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--pass-soft);border:1px solid var(--pass)} .fb.no{background:var(--fail-soft);border:1px solid var(--fail)}
.fb .h{font-weight:700} .fb.ok .h{color:var(--pass)} .fb.no .h{color:var(--fail)}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sunk)}

.term{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:13.5px;line-height:1.7;padding:16px;border-radius:10px;overflow-x:auto;white-space:pre}
.term .p{color:#7ea3ff} .term .g{color:#46c06a} .term .r{color:#f2695f}

.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.item .q{font-weight:650;margin:0}
.item ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.item li{display:flex;gap:8px;color:var(--muted);padding:3px 8px;border-radius:6px;overflow-wrap:anywhere}
.item li b{font-family:var(--f-mono);flex:none}
.item li.ans{color:var(--ink);background:var(--pass-soft);font-weight:600}
.item li.ans b{color:var(--pass)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.badge{font-size:11px;padding:1px 7px;border-radius:20px;font-family:var(--f-text);font-weight:600}
.badge.ok{background:var(--pass-soft);color:var(--pass)} .badge.no{background:var(--fail-soft);color:var(--fail)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Тренажёр ПМ 8</h1>
    <p class="sub"><b>150 вопросов</b> · 1–38 ООП в C# · 39–76 Проектирование модулей · 77–113 Сборка .NET · 114–150 Конвертация данных</p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Режим">
      <button id="m-quiz" data-mode="quiz">Тест</button>
      <button id="m-list" data-mode="list">Шпаргалка</button>
    </div>
    <div class="seg" role="group" aria-label="Раздел">
      <button id="s-all" data-sec="all">Все</button>
      <button id="s-81" data-sec="8.1">1–38</button>
      <button id="s-82" data-sec="8.2">39–76</button>
      <button id="s-83" data-sec="8.3">8.3</button>
      <button id="s-84" data-sec="8.4">8.4</button>
    </div>
  </div>
  <div class="bar" id="quizbar">
    <label class="chk"><input type="checkbox" id="shq"> Перемешать вопросы</label>
    <span class="spacer"></span>
    <button class="btn" id="wrongBtn">Только ошибки</button>
    <button class="btn" id="restartBtn">Заново</button>
  </div>

  <details class="map" id="mapBox" open>
    <summary>Карта вопросов <span id="sumTxt"></span></summary>
    <div class="map-head">
      <span>Отвечено верно: <strong id="cOk">0</strong></span>
      <span>С ошибкой: <strong id="cNo">0</strong></span>
      <span>Не пройдено: <strong id="cNone">0</strong></span>
      <span class="spacer"></span>
      <span class="legend"><i class="dot ok"></i>верно</span>
      <span class="legend"><i class="dot no"></i>ошибка</span>
      <button class="btn warn" id="resetBtn" style="padding:3px 9px;font-size:12.5px">Сбросить прогресс</button>
    </div>
    <div id="cells"></div>
  </details>

  <main id="main"></main>
</div>

<script>
const Q = [
[1, "8.1", "Объектіге бағытталған бағдарламалау парадигмасының негізгі тұжырымдамасы қандай?", null, ["Пәндік саланы күйді (өрістер) және мінез-құлықты (әдістер) біріктіретін объектілер түрінде модельдеу", "Бағдарламаны жол нөмірлері бойынша қатаң орындау", "Функциялар мен әдістерді қолданудан толық бас тарту", "Кодты тікелей пәрмен жолына компиляциялау", "Тек глобалдық айнымалыларды пайдалану"], 0],
[2, "8.1", "Әдісті шақырған кезде C# тіліндегі берілген код нені шығарады?", "class Person\n{\n    public string Name = \"Alex\";\n}\nPerson p = new Person();\nConsole.Write(p.Name);", ["Person", "Alex", "null", "Name", "Компиляция қатесі"], 1],
[3, "8.1", "Қандай қол жеткізу модификаторы класс элементін ТЕК осы класстың ішінде қолжетімді етеді?", null, ["public", "protected", "private", "internal", "protected internal"], 2],
[4, "8.1", "C# тіліндегі класс конструкторы қандай рөл атқарады?", null, ["Объектіні жедел жадыдан жояды", "Желілік қосылымның бар-жоғын тексереді", "Бағдарлама кодын ассемблерге түрлендіреді", "Объект жасалған кезде new кілт сөзі арқылы оның бастапқы күйін инициализациялайды", "switch операторының орнын алмастырады"], 3],
[5, "8.1", "C# тіліндегі келесі код үзіндісі нені шығарады?", "class Car\n{\n    public int Speed;\n    public Car(int speed)\n    {\n        Speed = speed;\n    }\n}\nCar c = new Car(100);\nConsole.Write(c.Speed);", ["0", "speed", "NullReferenceException", "Car", "100"], 4],
[6, "8.1", "Объектіге бағытталған бағдарламалауда (ООП) инкапсуляция деп нені түсінеді?", null, ["Класстың ішкі іске асырылуын жасыру және жария интерфейс (қасиеттер/әдістер) арқылы бақыланатын қолжетімділікті қамтамасыз ету", "Класстың басқа класстың әдістерін мұрагерлікке алу мүмкіндігі", "Аты бірдей бірнеше әдіс жасау", "Объектілік кодты конфигурация файлдарына түрлендіру", "Әдістің өзін-өзі шақыруы (рекурсия)"], 0],
[7, "8.1", "C# тіліндегі қандай қол жеткізу модификаторы класс мүшесіне ағымдағы жинақ (.dll/.exe) шегінде қолжетімділікке рұқсат береді?", null, ["private", "internal", "protected", "sealed", "abstract"], 1],
[8, "8.1", "Жеке (private) айнымалыға қол жеткізуге тырысқанда бұл код нені шығарады?", "class Account\n{\n    private int balance = 500;\n}\nAccount acc = new Account();\nConsole.Write(acc.balance);", ["500", "0", "Компиляция қатесі: қорғау деңгейіне (private) байланысты balance қолжетімсіз", "null", "Balance"], 2],
[9, "8.1", "C# тілінде автоқасиеттер (Auto-Properties) не үшін қолданылады?", null, ["Процессордың жұмысын жылдамдату үшін", "Жедел жадыны автоматты түрде тазалау үшін", "Класты деректер базасымен байланыстыру үшін", "Жасырын жабық өрісті (backing field) автоматты түрде жасай отырып, қасиетті қысқаша жариялау үшін", "Интерфейстер жасау үшін"], 3],
[10, "8.1", "Логикасы бар қасиетті қолданатын C# код үзіндісі нені шығарады?", "class User\n{\n    private int _age;\n    public int Age\n    {\n        get => _age;\n        set => _age = value \u003c 0 ? 0 : value;\n    }\n}\nUser u = new User();\nu.Age = -15;\nConsole.Write(u.Age);", ["-15", "null", "15", "ArgumentException", "0"], 4],
[11, "8.1", "C# тілінде бір класты екіншісінен мұрагерлікке алу үшін қандай кілт сөз қолданылады?", null, ["Қос нүкте (:)", "implements", "inherits", "extends", "base"], 0],
[12, "8.1", "Мұраланған әдісті шақырған кезде бұл код нені шығарады?", "class Animal\n{\n    public void Eat() => Console.Write(\"Food\");\n}\nclass Dog : Animal { }Dog d = new Dog();\nd.Eat();", ["Dog", "Food", "Animal", "Nothing", "Компиляция қатесі"], 1],
[13, "8.1", "C# тілінде негізгі класста еншілес класқа әдісті қайта анықтауға рұқсат беру үшін қандай кілт сөз қолданылады?", null, ["override", "sealed", "virtual", "static", "new"], 2],
[14, "8.1", "C# тілінде негізгі класстың виртуалды әдісін қайта анықтау үшін еншілес класста қандай кілт сөз қолданылады?", null, ["virtual", "shadow", "base", "override", "abstract"], 3],
[15, "8.1", "Полиморфизмі бар келесі код үзіндісі нені шығарады?", "class Printer\n{\n    public virtual void Print() => Console.Write(\"Base\");\n}\nclass ColorPrinter : Printer\n{\n    public override void Print() => Console.Write(\"Color\");\n}\nPrinter p = new ColorPrinter();\np.Print();", ["Base", "Компиляция қатесі", "BaseColor", "Printer", "Color"], 4],
[16, "8.1", "Негізгі класқа base кілт сөзі арқылы қол жеткізген кезде бұл код нені шығарады?", "class Parent\n{\n    public virtual void Greet() => Console.Write(\"Hi\");\n}\nclass Child : Parent\n{\n    public override void Greet()\n    {\n        base.Greet();\n        Console.Write(\"!\");\n    }\n}\nChild c = new Child();\nc.Greet();", ["Hi!", "!", "Hi", "Child!", "ParentHi"], 0],
[17, "8.1", "C# тілінде қандай кілт сөз осы класстан әрі қарай мұрагерлікке алуға тыйым салады?", null, ["abstract", "sealed", "final", "static", "const"], 1],
[18, "8.1", "sealed модификаторы бар класстан мұрагерлікке алуға тырысқанда қандай қате орын алады?", "sealed class FinalClass { }class SubClass : FinalClass { }", ["Орындалу кезінде NullReferenceException", "Компилятордан ескерту, бірақ жоба құрастырылады", "Компиляция қатесі: мөрленген класстан (sealed class) мұрагерлікке алуға болмайды", "Жедел жадының толып кетуі", "Жақшалар синтаксисінің қатесі"], 2],

const LET = 'ABCDE';
const byNum = {}; Q.forEach(q => byNum[q[0]] = q);
function load(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let S = load('tr84-stats') || {};
let P = Object.assign({mode:'quiz', sec:'all', shQ:false}, load('tr84-pref') || {});
let queue = [], pos = 0, answered = false, sess = {ok:0, bad:0}, onlyWrong = false, search = '', resetArmed = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inSec = q => P.sec === 'all' || q[1] === P.sec;
const status = n => S[n] ? (S[n].last ? 'ok' : 'no') : '';
const secName = s => s === '8.1' ? '1–38' : s === '8.2' ? '39–76' : 'ОН ' + s;
const $ = id => document.getElementById(id);

function buildQueue(){
  let items = Q.filter(inSec);
  if (onlyWrong) items = items.filter(q => status(q[0]) === 'no');
  queue = (P.shQ ? shuffle(items) : items).map(q => q[0]);
  pos = 0; answered = false; sess = {ok:0, bad:0};
}

function renderBar(){
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === P.mode));
  document.querySelectorAll('[data-sec]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === P.sec));
  $('quizbar').hidden = P.mode !== 'quiz';
  $('shq').checked = P.shQ;
  const wrongN = Q.filter(inSec).filter(q => status(q[0]) === 'no').length;
  const wb = $('wrongBtn');
  wb.textContent = onlyWrong ? 'Показать все' : 'Только ошибки (' + wrongN + ')';
  wb.disabled = !onlyWrong && wrongN === 0;
  wb.classList.toggle('primary', onlyWrong);
}

function renderMap(){
  let ok = 0, no = 0, none = 0;
  const cur = P.mode === 'quiz' ? queue[pos] : null;
  const groups = [['8.1','1–38 · ООП в C#'],['8.2','39–76 · Проектирование модулей'],['8.3','ОН 8.3 · Сборка модулей'],['8.4','ОН 8.4 · Конвертация данных']].filter(g => P.sec === 'all' || P.sec === g[0]);
  $('cells').innerHTML = groups.map(([sec, label]) => {
    const cells = Q.filter(q => q[1] === sec).map(q => {
      const st = status(q[0]);
      if (st === 'ok') ok++; else if (st === 'no') no++; else none++;
      return '<button class="cell ' + st + (q[0] === cur ? ' cur' : '') + '" data-jump="' + q[0] + '" aria-label="Вопрос ' + q[0] + '">' + q[0] + '</button>';
    }).join('');
    return '<div class="grp"><div class="grp-label">' + label + '</div><div class="cells">' + cells + '</div></div>';
  }).join('');
  $('cOk').textContent = ok; $('cNo').textContent = no; $('cNone').textContent = none;
  $('sumTxt').textContent = '✓ ' + ok + ' · ✗ ' + no + ' · осталось ' + none;
}

function renderQuiz(){
  const main = $('main');
  if (!queue.length){
    main.innerHTML = '<div class="card"><p class="empty">' + (onlyWrong ? 'Ошибок нет — все вопросы этого раздела отвечены верно.' : 'Нет вопросов.') + '</p></div>';
    return;
  }
  if (pos >= queue.length) return renderDone();
  const q = byNum[queue[pos]];
  answered = false;
  main.innerHTML =
    '<div class="card">' +
      '<div class="meta"><span>Вопрос ' + (pos+1) + ' / ' + queue.length + ' · №' + q[0] + ' · ' + secName(q[1]) + '</span>' +
      '<span class="tally">верно <b>' + sess.ok + '</b> · ошибок <i>' + sess.bad + '</i></span></div>' +
      '<div class="prog"><span style="width:' + (pos / queue.length * 100) + '%"></span></div>' +
      '<p class="qtext">' + fmt(q[2]) + '</p>' +
      (q[3] ? '<pre>' + esc(q[3]) + '</pre>' : '') +
      '<div class="opts">' + q[4].map((option, i) =>
        '<button class="opt" data-i="' + i + '"><span class="l">' + LET[i] + '</span><span class="t">' + fmt(option) + '</span></button>').join('') + '</div>' +
      '<div id="fb"></div>' +
      '<div class="nav"><button class="btn primary" id="nextBtn">Пропустить</button>' +
      '<span class="hint">Клавиши: <kbd>A</kbd>–<kbd>E</kbd> или <kbd>1</kbd>–<kbd>5</kbd> — ответ, <kbd>Enter</kbd> — дальше</span></div>' +
    '</div>';
}

function answer(i){
  if (answered || P.mode !== 'quiz' || pos >= queue.length) return;
  answered = true;
  const q = byNum[queue[pos]];
  const correct = i === q[5];
  const rec = S[q[0]] || {r:0, w:0};
  if (correct) { rec.r++; sess.ok++; } else { rec.w++; sess.bad++; }
  rec.last = correct; S[q[0]] = rec; save('tr84-stats', S);
  document.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (j === q[5]) b.classList.add('good');
    else if (j === i) b.classList.add('bad');
    else b.classList.add('dim');
  });
  $('fb').innerHTML = '<div class="fb ' + (correct ? 'ok' : 'no') + '">' +
    '<span class="h">' + (correct ? 'Верно' : 'Неверно — правильный ответ ' + LET[q[5]]) + '</span>' +
    '<span>' + LET[q[5]] + ') ' + fmt(q[4][q[5]]) + '</span></div>';
  const nb = $('nextBtn'); nb.textContent = pos + 1 < queue.length ? 'Дальше →' : 'Итоги →'; nb.focus();
  renderMap(); renderBar();
}

function next(){ pos++; renderQuiz(); renderMap(); }

function renderDone(){
  const total = sess.ok + sess.bad, skipped = queue.length - total;
  const pass = sess.bad === 0 && total > 0;
  const pad = n => String(n).padStart(4, ' ');
  const pct = total ? Math.round(sess.ok / total * 100) : 0;
  const wrongN = Q.filter(inSec).filter(q => status(q[0]) === 'no').length;
  $('main').innerHTML = '<div class="card">' +
    '<div class="term"><span class="p">$ dotnet test</span>\nТестовый прогон завершён. Результат: ' + pct + '%\n' +
    (pass ? '<span class="g">Passed!</span>' : '<span class="r">Failed!</span>') +
    '  - Failed:' + pad(sess.bad) + ', Passed:' + pad(sess.ok) + ', Skipped:' + pad(skipped) + ', Total:' + pad(queue.length) + '</div>' +
    '<div class="nav">' +
      (wrongN ? '<button class="btn primary" id="redoWrong">Повторить ошибки (' + wrongN + ')</button>' : '') +
      '<button class="btn" id="redoAll">Пройти заново</button>' +
      '<button class="btn" id="toList">Открыть шпаргалку</button></div></div>';
  $('redoWrong') && ($('redoWrong').onclick = () => { onlyWrong = true; start(); });
  $('redoAll').onclick = () => { onlyWrong = false; start(); };
  $('toList').onclick = () => setMode('list');
}

function renderList(){
  const s = search.trim().toLowerCase();
  const items = Q.filter(inSec).filter(q => !s || String(q[0]) === s || (q[2] + ' ' + (q[3] || '') + ' ' + q[4].join(' ')).toLowerCase().includes(s));
  const main = $('main');
  if (!$('search')) {
    main.innerHTML = '<input class="search" id="search" type="search" placeholder="Поиск по номеру, тексту или варианту (например: dotnet publish)"><div class="list" id="list"></div>';
    $('search').value = search;
    $('search').addEventListener('input', e => { search = e.target.value; renderList(); });
  }
  $('list').innerHTML = items.length ? items.map(q => {
    const st = status(q[0]);
    return '<article class="item"><div class="num">№' + q[0] + ' · ' + secName(q[1]) +
      (st ? ' <span class="badge ' + st + '">' + (st === 'ok' ? 'верно' : 'была ошибка') + '</span>' : '') + '</div>' +
      '<p class="q">' + fmt(q[2]) + '</p>' + (q[3] ? '<pre>' + esc(q[3]) + '</pre>' : '') +
      '<ol>' + q[4].map((o, i) => '<li class="' + (i === q[5] ? 'ans' : '') + '"><b>' + LET[i] + ')</b><span>' + fmt(o) + '</span></li>').join('') + '</ol>' +
      '</article>';
  }).join('') : '<p class="empty">Ничего не найдено.</p>';
}

function render(){
  renderBar(); renderMap();
  if (P.mode === 'quiz') renderQuiz(); else renderList();
}
function start(){ buildQueue(); save('tr84-pref', P); render(); }
function setMode(m){ P.mode = m; save('tr84-pref', P); $('main').innerHTML = ''; if (m === 'quiz' && (!queue.length || pos >= queue.length)) buildQueue(); render(); }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.mode) setMode(t.dataset.mode);
  else if (t.dataset.sec) { P.sec = t.dataset.sec; onlyWrong = false; if (P.mode === 'quiz') start(); else { save('tr84-pref', P); render(); } }
  else if (t.dataset.i != null) answer(+t.dataset.i);
  else if (t.id === 'nextBtn') next();
  else if (t.id === 'wrongBtn') { onlyWrong = !onlyWrong; P.mode = 'quiz'; $('main').innerHTML=''; start(); }
  else if (t.id === 'restartBtn') { onlyWrong = false; start(); }
  else if (t.dataset.jump) {
    const n = +t.dataset.jump;
    if (P.mode !== 'quiz') { P.mode = 'quiz'; $('main').innerHTML=''; }
    if (!queue.includes(n)) { onlyWrong = false; buildQueue(); }
    const at = queue.indexOf(n);
    if (at < pos || pos >= queue.length) { queue.splice(at, 1); pos = Math.min(pos, queue.length); queue.splice(pos, 0, n); }
    else { queue.splice(at, 1); queue.splice(pos, 0, n); }
    save('tr84-pref', P); render();
    window.scrollTo({top: $('main').offsetTop - 12, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  }
  else if (t.id === 'resetBtn') {
    if (!resetArmed) { resetArmed = true; t.textContent = 'Точно сбросить? Нажмите ещё раз'; setTimeout(() => { resetArmed = false; t.textContent = 'Сбросить прогресс'; }, 3000); }
    else { resetArmed = false; t.textContent = 'Сбросить прогресс'; S = {}; save('tr84-stats', S); onlyWrong = false; start(); }
  }
});
$('shq').addEventListener('change', e => { P.shQ = e.target.checked; start(); });

document.addEventListener('keydown', e => {
  if (P.mode !== 'quiz' || e.target.matches('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4,'ф':0,'и':1,'с':2,'в':3,'у':4};
  if (k in map && !answered) { e.preventDefault(); answer(map[k]); }
  else if ((k === 'enter' || k === 'arrowright') && pos < queue.length && document.activeElement?.id !== 'nextBtn') { e.preventDefault(); next(); }
});

try { if (matchMedia('(max-width: 600px)').matches) $('mapBox').open = false; } catch(e){}
buildQueue(); render();
</script>
